name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Download yt-dlp, FFmpeg and Deno
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build\bin, build\tmp | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile build\bin\yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile build\tmp\ffmpeg.zip
          Expand-Archive build\tmp\ffmpeg.zip build\tmp\ffmpeg
          $d = Get-ChildItem build\tmp\ffmpeg -Directory | Select-Object -First 1
          Copy-Item "$($d.FullName)\bin\ffmpeg.exe", "$($d.FullName)\bin\ffprobe.exe" build\bin
          Copy-Item "$($d.FullName)\LICENSE.txt" build\bin\FFMPEG-LICENSE.txt
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile build\tmp\deno.zip
          Expand-Archive build\tmp\deno.zip build\bin
          Get-ChildItem build\bin | Format-Table Name, Length

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm --clean --windowed --name YTPlaylistDownloader --add-data "docs;docs" app.py

      - name: Add tools and notices to the app folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "dist\YTPlaylistDownloader"
          New-Item -ItemType Directory -Force "$app\bin" | Out-Null
          Copy-Item build\bin\* "$app\bin\" -Recurse
          Copy-Item THIRD_PARTY_NOTICES.txt $app

      - name: Self-test portable build (PATH without Python/FFmpeg)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $out = "$PWD\selftest-portable.txt"
          $p = Start-Process "dist\YTPlaylistDownloader\YTPlaylistDownloader.exe" -ArgumentList "--selftest", $out -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path $out) {
            Get-Content $out -Encoding UTF8
            Get-Content $out -Encoding UTF8 | Where-Object { $_ -match "^FAIL" -or $_ -match "^RESULT: FAILED" } | ForEach-Object { Write-Host "::error::$_" }
          } else {
            Write-Host "::error::exe produced no result file (crashed on start), exit code $($p.ExitCode)"
          }
          if ($p.ExitCode -ne 0) { throw "self-test failed" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item dist-installer\Setup.exe | Format-Table Name, Length

      - name: Test the installer (silent install, self-test, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "ytpd"
          $p = Start-Process dist-installer\Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=desktopicon", "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          foreach ($f in "YTPlaylistDownloader.exe", "bin\yt-dlp.exe", "bin\ffmpeg.exe", "bin\ffprobe.exe", "bin\deno.exe", "docs\index.html", "_internal\docs\index.html") {
            $path = Join-Path $dir $f
            if (Test-Path $path) { "OK   $f" } elseif ($f -eq "docs\index.html") { "skip $f" } else { throw "missing: $f" }
          }
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\YouTube Playlist Downloader.lnk"
          if (-not (Test-Path $lnk)) { throw "Start Menu shortcut missing" }
          "OK   Start Menu shortcut"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $t = Start-Process (Join-Path $dir "YTPlaylistDownloader.exe") -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest-installed.txt" -Wait -PassThru
          $res = "$env:RUNNER_TEMP\selftest-installed.txt"
          if (Test-Path $res) {
            Get-Content $res -Encoding UTF8
            Get-Content $res -Encoding UTF8 | Where-Object { $_ -match "^FAIL" } | ForEach-Object { Write-Host "::error::$_" }
          } else { Write-Host "::error::installed exe produced no result file" }
          if ($t.ExitCode -ne 0) { throw "installed self-test failed" }
          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir "YTPlaylistDownloader.exe")); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $dir "YTPlaylistDownloader.exe")) { throw "uninstall left files behind" }
          "OK   uninstall"

      - uses: actions/upload-artifact@v4
        with:
          name: Setup
          path: dist-installer/Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/Setup.exe
          generate_release_notes: true
